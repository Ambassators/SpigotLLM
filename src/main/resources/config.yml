# Only the server console can edit the authorized operator allowlist.
# A player must be both OP and present in that allowlist.

execution:
  # Agent-mode GitHub repositories and source changes live here. Relative paths
  # are resolved inside plugins/SpigotLLM; absolute paths are explicit overrides.
  agent-working-directory: "workspace"
  chat-timeout-seconds: 300
  agent-timeout-seconds: 1800
  max-concurrent-prompts: 2

# Agent mode only. Commands requested through this bridge execute as the real
# Minecraft server console and therefore have full server authority.
agent-console:
  log-file: "logs/latest.log"
  poll-ticks: 1
  max-command-length: 2048

# Agent mode only. These tools compile and run unsandboxed Java and can inspect
# or mutate the live server through reflection. They have full server authority.
agent-tools:
  enabled: true
  max-request-bytes: 262144
  max-source-bytes: 131072
  max-resources-per-owner: 64
  max-handles-per-owner: 512
  max-ttl-seconds: 86400
  max-queued-events: 5000
  max-event-stream-bytes: 5242880
  slow-main-thread-millis: 50
  compiler-threads: 1
  load-persistent: true

runtimes:
  retain-releases: 2
  connect-timeout-seconds: 20
  download-timeout-seconds: 900
  codex:
    executable: ""
  claude:
    executable: ""

output:
  lines-per-page: 8
  max-line-length: 220
